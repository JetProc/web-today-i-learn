<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta property="og:title" content="파라디 아카이브 | Today I Learned" />
    <meta
      property="og:description"
      content="HTML, CSS, JavaScript로 만든 정적 개인 소개 페이지와 학습 기록장"
    />
    <meta property="og:image" content="./images/og-thumbnail.svg" />

    <title>파라디 아카이브 | Today I Learned</title>
    <link rel="icon" href="./images/og-thumbnail.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/main.css" />
    <script type="module" src="./js/index.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="top-nav" aria-label="주요 섹션">
        <a class="nav-logo" id="nav-logo" href="#about">파라디 아카이브</a>
        <ul class="nav-links">
          <li><a href="#about">프로필</a></li>
          <li><a href="#intro">자기소개</a></li>
          <li><a href="#info">기본 정보</a></li>
          <li><a href="#gallery">갤러리</a></li>
          <li><a href="#works">인생 작품</a></li>
          <li><a href="#til">TIL</a></li>
        </ul>
      </nav>

      <section class="hero" id="about">
        <div class="profile-card">
          <div class="profile-image" id="profile-image"></div>
          <div class="profile-info">
            <p class="hero-eyebrow">About Me</p>
            <h1 id="profile-nickname"></h1>
            <p class="tagline" id="profile-tagline"></p>
          </div>
        </div>
      </section>
    </header>

    <main>
      <section class="content-section" id="intro">
        <h2>자기소개</h2>
        <div class="intro-content" id="intro-content"></div>
      </section>

      <section class="content-section" id="info">
        <h2>기본 정보</h2>
        <table class="info-table">
          <caption class="sr-only">
            프로필 기본 정보
          </caption>
          <tbody id="info-table-body"></tbody>
        </table>
      </section>

      <section class="content-section" id="gallery">
        <h2>나만의 갤러리</h2>
        <p class="section-desc" id="gallery-subtitle"></p>
        <div class="gallery-grid" id="gallery-grid"></div>
      </section>

      <section class="content-section" id="works">
        <h2>나를 울린 인생 작품</h2>
        <p class="section-desc">
          오래 남는 장면과 문장을 다시 꺼내 볼 수 있도록 목록으로 정리했습니다.
        </p>
        <ol class="works-list" id="works-list"></ol>
      </section>

      <section class="content-section" id="til">
        <h2>TIL</h2>
        <p class="section-desc">오늘 새롭게 배운 것들을 기록합니다.</p>

        <form class="til-form" id="til-form">
          <div class="form-group">
            <label for="til-date">날짜</label>
            <input type="date" id="til-date" name="date" required />
          </div>
          <div class="form-group">
            <label for="til-title">제목</label>
            <input
              type="text"
              id="til-title"
              name="title"
              placeholder="학습 주제를 입력하세요"
              required
            />
          </div>
          <div class="form-group">
            <label for="til-content">내용</label>
            <textarea
              id="til-content"
              name="content"
              placeholder="오늘 배운 내용을 정리해주세요"
              required
            ></textarea>
          </div>
          <div class="form-actions">
            <button type="submit">등록</button>
            <button type="reset">초기화</button>
          </div>
        </form>

        <div class="til-list" id="til-list" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p id="footer-copy"></p>
    </footer>

    <div class="gallery-lightbox" id="gallery-lightbox" hidden aria-hidden="true">
      <div
        class="gallery-lightbox-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="gallery-lightbox-caption"
      >
        <button
          type="button"
          class="gallery-lightbox-close"
          id="gallery-lightbox-close"
          aria-label="확대 이미지 닫기"
        >
          닫기
        </button>
        <figure class="gallery-lightbox-figure">
          <img id="gallery-lightbox-image" alt="" />
          <figcaption id="gallery-lightbox-caption"></figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
